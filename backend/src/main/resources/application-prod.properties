# ============================================================
# 生产环境配置（Railway 部署，配合 Cloudflare Pages 前端）
# 启动: java -jar app.jar --spring.profiles.active=prod
# 所有敏感配置通过 Railway 环境变量注入
# ============================================================
server.port=${PORT:8080}

# MySQL（Railway 的 MySQL 插件变量 MYSQL* 需手动“引用”到本服务，见部署文档第四节）
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# HikariCP 连接池：小项目缩小连接数，降低每个连接的内存与 MySQL 侧开销
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# 首次部署自动建表（省去手动跑 schema.sql）；生产稳定后如需更严格校验可改回 validate
spring.jpa.hibernate.ddl-auto=update
# 关闭 Open Session In View：请求结束后不再长持有数据库连接/实体管理器
spring.jpa.open-in-view=false

# JWT HS256 签名密钥（必填，≥32 字节随机串，可用 openssl rand -base64 48 生成）
app.jwt.secret=${JWT_SECRET}

# 首次启动自动创建管理员的初始密码（members 表为空时必填，否则启动失败）
app.admin.initial-password=${APP_ADMIN_PASSWORD:}

# CORS：填 Cloudflare Pages 前端域名（多个用逗号分隔）
app.cors.allowed-origins=${CORS_ORIGINS:*}

# 存储：s3=对象存储(Cloudflare R2，推荐) / local=本地磁盘(Railway 上文件重启即丢，不推荐)
app.storage.type=${STORAGE_TYPE:s3}
app.storage.s3.endpoint=${R2_ENDPOINT:}
app.storage.s3.access-key=${R2_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${R2_SECRET_ACCESS_KEY:}
app.storage.s3.bucket=${R2_BUCKET:}
app.storage.s3.public-base-url=${R2_PUBLIC_BASE_URL:}

# 日志（Railway 采集 stdout，同时落盘按天滚动保留 30 天）
logging.file.name=${LOG_DIR:logs}/app.log
logging.logback.rollingpolicy.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n
