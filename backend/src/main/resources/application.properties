server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/thz_spectrum?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

app.upload.dir=uploads

# 存储类型：local(本地磁盘) / s3(对象存储，如 Cloudflare R2)
app.storage.type=local

# CORS 允许的源（逗号分隔；* 表示全部，分离部署时填前端域名）
app.cors.allowed-origins=*

# 首次启动自动创建默认管理员的初始密码，可用环境变量 APP_ADMIN_PASSWORD 覆盖
app.admin.initial-password=${APP_ADMIN_PASSWORD:admin}

server.servlet.session.timeout=1800

# JWT HS256签名密钥（≥32字节），可用环境变量 JWT_SECRET 覆盖，生产务必更换
app.jwt.secret=${JWT_SECRET:thz-**************************************************************************************************ong!}
