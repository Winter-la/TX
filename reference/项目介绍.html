        <h2>项目介绍</h2>
        <p>&nbsp&nbsp&nbsp&nbsp 随着人们生活水平的提高，健康已成为热门话题。智能指纹图谱项目利用先进的太赫兹时域光谱和拉曼技术，进行中草药、保健品以及奶粉等材料的光谱分析，创造出它们在太赫兹光谱和拉曼两种技术独有的图谱，建立一个太赫兹光谱大数据库，利用算法进行成分的标定。一方面，利用这两种技术可以方便的为某些机构标定物质种类，另外一方面，作为一种新的、无接触的检测手段可以为国家相关部分服务。
        </p>
