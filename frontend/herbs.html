<!-- Admin 登录模态框（内联） -->
<div id="adminLoginModal" class="admin-modal-mask" style="display:none" onclick="closeAdminLogin()">
  <div class="admin-modal" onclick="event.stopPropagation()">
    <button class="admin-modal-close" onclick="closeAdminLogin()" title="关闭">&times;</button>
    <h3 class="admin-modal-title">Admin 系统登录</h3>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
(function () {
    var grid = document.getElementById('herbGrid');
    fetch(apiUrl('/api/products?page=0&size=100'))
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var items = (d && d.items) || [];
            if (!items.length) {
                grid.innerHTML = '<p style="color:#999;grid-column:1/-1;">暂无药材数据</p>';
                return;
            }
            var h = '';
            items.forEach(function (p) {
                h += '<div class="herb-card">'
                    + '<h3>' + esc(p.name) + '</h3>'
                    + '<p><strong>产品码：</strong>' + esc(p.code) + '</p>'
                    + '<p><strong>类型：</strong>' + esc(p.type) + '</p>'
                    + '<p><strong>产地：</strong>' + esc(p.origin) + '</p>'
                    + '<p><strong>简介：</strong>' + esc(p.description) + '</p>'
                    + '</div>';
            });
            grid.innerHTML = h;
        })
        .catch(function () {
            grid.innerHTML = '<p style="color:#e53935;grid-column:1/-1;">加载失败，请稍后重试</p>';
        });
})();
</script>

</body>
